name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.5
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag lunarcrush-pairlist:ci .
      - name: Smoke-test non-root runtime and SQLite volume
        run: |
          set -euo pipefail
          docker volume create lunar-pairlist-ci-data
          trap 'docker rm -f lunar-pairlist-ci >/dev/null 2>&1 || true; docker volume rm lunar-pairlist-ci-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name lunar-pairlist-ci \
            --read-only \
            -p 18080:8080 \
            -e LUNARCRUSH_API_KEY=ci-placeholder \
            -e CENTRAL_REFRESH_SECONDS=300 \
            -v lunar-pairlist-ci-data:/data \
            lunarcrush-pairlist:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs lunar-pairlist-ci
              exit 1
            fi
            sleep 1
          done
          docker exec lunar-pairlist-ci /app -healthcheck
          docker inspect --format '{{.Config.User}}' lunar-pairlist-ci | grep -Eq 'nonroot|65532'

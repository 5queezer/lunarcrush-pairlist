services:
  pairlist:
    build:
      context: .
    image: lunarcrush-pairlist:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - pairlist-data:/data
    mem_limit: 64m
    pids_limit: 100
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pairlist-data:
